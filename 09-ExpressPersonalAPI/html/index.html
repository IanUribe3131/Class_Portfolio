<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express test</title>
</head>

<body>
    <% if (locals.error) { %>
        <h3>
            <%= error %>
        </h3>
        <% } %>
    <form action="/greet" method="get">
        Register:
        <input type="text" name="name" id="name" placeholder="Name" required>
        <input type="submit" value="go next">
    </form>

    <% if (names.length) { %>
        <p>Hello, <%= names[names.length - 1] %>!</p>
        <ul>
            <% names.forEach((name, index) => { %>
                <li><a href="/greet/<%= index %>"><%= name %></a></li>
            <% }) %>
        </ul>
    <% } %>

    <h2>TODO List</h2>
    <form action="/task" method="post">
        <input type="text" name="task" placeholder="New task" required>
        <input type="submit" value="Add task">
    </form>

    <ul>
        <% tasks.forEach((task, index) => { %>
            <li>
                <%= task %>
                <form action="/task/<%= index %>/up" method="post" style="display: inline">
                    <button type="submit" aria-label="Move task up">&#8593;</button>
                </form>
                <form action="/task/<%= index %>/down" method="post" style="display: inline">
                    <button type="submit" aria-label="Move task down">&#8595;</button>
                </form>
                <button type="button" onclick="deleteTask(<%= index %>)">Delete</button>
            </li>
        <% }) %>
    </ul>

    <script>
        async function deleteTask(index) {
            await fetch(`/task/${index}`, { method: 'DELETE' });
            window.location.href = '/';
        }
    </script>

</body>

</html>
